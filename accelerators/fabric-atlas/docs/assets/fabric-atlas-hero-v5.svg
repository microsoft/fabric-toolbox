<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc" data-version="5">
  <title id="title">Fabric Atlas</title>
  <desc id="desc">Open-source workspace intelligence for Microsoft Fabric, presented in the Fabric Atlas About page style.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f4f0"/>
      <stop offset="0.52" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f0f8"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#742774"/>
      <stop offset="0.58" stop-color="#0078d4"/>
      <stop offset="1" stop-color="#117865"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d1d1d1" stroke-opacity="0.34"/>
    </pattern>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    <filter id="shadow8" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1600" height="500" fill="url(#background)"/>
  <rect width="1600" height="500" fill="url(#grid)" opacity="0.55"/>
  <circle cx="132" cy="86" r="190" fill="#117865" opacity="0.035"/>
  <circle cx="1480" cy="470" r="250" fill="#742774" opacity="0.045"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(80 56)" font-size="12" font-weight="650">
      <g>
        <rect width="122" height="32" rx="16" fill="#f1faf1" stroke="#9fd89f"/>
        <circle cx="18" cy="16" r="4" fill="#0e700e"/>
        <text x="31" y="20" fill="#0e700e">OPEN SOURCE</text>
      </g>
      <g transform="translate(134)">
        <rect width="112" height="32" rx="16" fill="#ffffff" stroke="#d1d1d1"/>
        <text x="18" y="20" fill="#424242">MIT LICENSED</text>
      </g>
      <g transform="translate(258)">
        <rect width="124" height="32" rx="16" fill="#e3f7ef" stroke="#9ee0cb"/>
        <text x="18" y="20" fill="#0c695a">FABRIC NATIVE</text>
      </g>
    </g>

    <g transform="translate(80 126)">
      <rect width="78" height="78" rx="18" fill="url(#brand)" filter="url(#shadow4)"/>
      <path d="M39 16L60 28V52L39 64L18 52V28L39 16Z" fill="none" stroke="#ffffff" stroke-width="3"/>
      <path d="M29 48L35 31L52 27L46 44L29 48Z" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linejoin="round"/>
      <circle cx="40" cy="38" r="3.5" fill="#ffffff"/>
