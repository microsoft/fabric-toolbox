    <text x="182" y="146" fill="#0c695a" font-size="13" font-weight="700" letter-spacing="1.5">MICROSOFT FABRIC GOVERNANCE</text>
    <text x="182" y="198" fill="#242424" font-size="58" font-weight="700" letter-spacing="-1.4">Fabric Atlas</text>
    <text x="80" y="270" fill="#242424" font-size="27" font-weight="500">Workspace intelligence for Microsoft Fabric.</text>
    <text x="80" y="310" fill="#616161" font-size="17">Catalog &#183; lineage &#183; governance &#183; access &#183; operations</text>

    <g transform="translate(80 354)">
      <g>
        <rect width="158" height="66" rx="10" fill="#ffffff" stroke="#e0e0e0" filter="url(#shadow4)"/>
