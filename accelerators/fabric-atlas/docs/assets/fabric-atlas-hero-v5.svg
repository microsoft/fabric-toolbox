        <rect x="14" y="14" width="38" height="38" rx="9" fill="#eef6fc"/>
        <path d="M24 25H42V42H24ZM24 31H42M30 25V42" fill="none" stroke="#0078d4" stroke-width="1.8"/>
        <text x="66" y="29" fill="#242424" font-size="13" font-weight="650">Catalog</text>
        <text x="66" y="47" fill="#616161" font-size="11">Inspect metadata</text>
      </g>
      <g transform="translate(510)">
        <rect width="158" height="66" rx="10" fill="#ffffff" stroke="#e0e0e0" filter="url(#shadow4)"/>
        <rect x="14" y="14" width="38" height="38" rx="9" fill="#fffef5"/>
        <path d="M26 31V27A7 7 0 0 1 40 27V31M24 31H42V43H24Z" fill="none" stroke="#817400" stroke-width="1.8"/>
        <text x="66" y="29" fill="#242424" font-size="13" font-weight="650">Review</text>
        <text x="66" y="47" fill="#616161" font-size="11">Effective access</text>
      </g>
    </g>

    <g transform="translate(840 60)">
      <rect width="680" height="380" rx="18" fill="#ffffff" stroke="#d1d1d1" filter="url(#shadow8)"/>
      <rect width="680" height="56" rx="18" fill="#fafafa"/>
      <path d="M0 56H680" stroke="#e0e0e0"/>
      <circle cx="26" cy="28" r="5" fill="#bc2f32"/>
      <circle cx="44" cy="28" r="5" fill="#817400"/>
      <circle cx="62" cy="28" r="5" fill="#0e700e"/>
      <text x="84" y="33" fill="#616161" font-size="12">clone &amp; run</text>
      <rect x="610" y="14" width="44" height="28" rx="6" fill="#ffffff" stroke="#d1d1d1"/>
      <path d="M627 24H638V35H627ZM631 20H642V31" fill="none" stroke="#616161" stroke-width="1.5"/>

      <rect x="24" y="76" width="632" height="58" rx="10" fill="#f5f5f5" stroke="#e0e0e0"/>
      <text x="44" y="111" fill="#242424" font-family="Consolas, monospace" font-size="15">git clone https://github.com/fredgis/FabricAtlas.git</text>

      <g transform="translate(24 154)">
        <g>
          <rect width="302" height="84" rx="10" fill="#ffffff" stroke="#e0e0e0"/>
          <rect x="14" y="14" width="42" height="42" rx="10" fill="#e3f7ef"/>
          <path d="M26 25H44V43H26ZM31 30H39M31 35H39M31 40H36" fill="none" stroke="#117865" stroke-width="1.8" stroke-linecap="round"/>
          <text x="72" y="31" fill="#242424" font-size="14" font-weight="650">Governance Center</text>
          <text x="72" y="51" fill="#616161" font-size="11">Findings, changes and coverage</text>
          <text x="72" y="68" fill="#0c695a" font-size="10" font-weight="650">ACTIONABLE METADATA</text>
        </g>
        <g transform="translate(330)">
          <rect width="302" height="84" rx="10" fill="#ffffff" stroke="#e0e0e0"/>
          <rect x="14" y="14" width="42" height="42" rx="10" fill="#f7eff8"/>
          <circle cx="27" cy="35" r="3.5" fill="#742774"/>
          <circle cx="43" cy="27" r="3.5" fill="#742774"/>
          <circle cx="43" cy="43" r="3.5" fill="#742774"/>
          <path d="M30 33L40 29M30 37L40 41" stroke="#742774" stroke-width="2"/>
          <text x="72" y="31" fill="#242424" font-size="14" font-weight="650">Map &amp; lineage</text>
          <text x="72" y="51" fill="#616161" font-size="11">Verified upstream and downstream paths</text>
          <text x="72" y="68" fill="#742774" font-size="10" font-weight="650">IMPACT AWARE</text>
        </g>
      </g>

      <g transform="translate(24 252)">
        <g>
          <rect width="302" height="84" rx="10" fill="#ffffff" stroke="#e0e0e0"/>
          <rect x="14" y="14" width="42" height="42" rx="10" fill="#eef6fc"/>
          <path d="M25 25H45V45H25ZM25 32H45M32 25V45" fill="none" stroke="#0078d4" stroke-width="1.8"/>
          <text x="72" y="31" fill="#242424" font-size="14" font-weight="650">Asset Catalog</text>
          <text x="72" y="51" fill="#616161" font-size="11">Tables, columns and measures</text>
          <text x="72" y="68" fill="#005a9e" font-size="10" font-weight="650">DEEP INVENTORY</text>
        </g>
        <g transform="translate(330)">
          <rect width="302" height="84" rx="10" fill="#ffffff" stroke="#e0e0e0"/>
          <rect x="14" y="14" width="42" height="42" rx="10" fill="#fffef5"/>
          <path d="M28 33V29A7 7 0 0 1 42 29V33M26 33H44V46H26Z" fill="none" stroke="#817400" stroke-width="1.8"/>
          <text x="72" y="31" fill="#242424" font-size="14" font-weight="650">Access Review</text>
          <text x="72" y="51" fill="#616161" font-size="11">Additive permissions and evidence</text>
          <text x="72" y="68" fill="#6c5700" font-size="10" font-weight="650">REVIEW READY</text>
        </g>
      </g>

      <g transform="translate(24 350)">
        <circle cx="8" cy="8" r="5" fill="#0e700e"/>
        <text x="22" y="12" fill="#424242" font-size="11" font-weight="600">Metadata only</text>
        <text x="124" y="12" fill="#bdbdbd" font-size="11">&#183;</text>
        <text x="140" y="12" fill="#424242" font-size="11" font-weight="600">Deployed in Fabric</text>
        <text x="258" y="12" fill="#bdbdbd" font-size="11">&#183;</text>
        <text x="274" y="12" fill="#424242" font-size="11" font-weight="600">Built with React and Rayfin</text>
